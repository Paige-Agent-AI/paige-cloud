# PAIGE Cloud preview — Coolify/Docker Compose definition.
# Deploy to an isolated nonproduction host only. Do NOT point production DNS here.
version: "3.9"
services:
  paige-web-preview:
    build:
      context: .
      dockerfile: Dockerfile
    image: paige-cloud-preview:preview
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "coolify.managed=true"
      - "paige.cloud.tier=nonproduction-preview"
