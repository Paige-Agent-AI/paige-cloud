<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner sign-in · PAIGE Cloud</title>
<link rel="stylesheet" href="/assets/owner.css">
</head>
<body>
<header><div class="wrap">
  <span class="brand"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M5 18.5v-13h7.25a4.25 4.25 0 0 1 0 8.5H9.5m-.25 4.5H19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>PAIGE Cloud</span>
</div></header>
<main class="wrap" id="main">
  <section class="sign-in-panel" aria-labelledby="sign-in-title">
    <h1 id="sign-in-title">Owner sign-in</h1>
    <p class="muted">Sign in to view preview deployment status and release history.</p>
    <!-- LOGIN_ERROR -->
    <form action="/session" method="post" class="sign-in-form">
      <label for="password">Owner key</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" maxlength="43" spellcheck="false">
      <button class="primary" type="submit">Continue as owner</button>
    </form>
  </section>
</main>
</body>
</html>
