<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · PAIGE Cloud</title>
<link rel="stylesheet" href="/assets/owner.css">
</head>
<body class="sign-in-page">
<header><div class="topbar">
  <span class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><polygon points="21,13.6 30.5,13.6 21,34.4 11.5,34.4"/><circle cx="34.5" cy="30.5" r="5.5"/></svg><span>PAIGE <span class="brand-cloud">Cloud</span></span></span>
</div></header>
<main id="main">
  <section class="sign-in-panel" aria-labelledby="sign-in-title">
    <h1 id="sign-in-title">{{TITLE}}</h1>
    {{DESCRIPTION}}
    {{MESSAGE}}
    <form action="{{MODE}}" method="post" class="sign-in-form">
      {{KEY_FIELD}}
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required autocomplete="username" maxlength="254" autocapitalize="none" spellcheck="false">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required {{PASSWORD_ATTRIBUTES}} maxlength="512" spellcheck="false">
      {{PASSWORD_HINT}}
      <button class="primary" type="submit">{{ACTION}}</button>
    </form>
    <div class="auth-links">{{LINKS}}</div>
  </section>
</main>
</body>
</html>
