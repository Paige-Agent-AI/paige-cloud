AWSTemplateFormatVersion: '2010-09-09'
Description: Customer Zero site and same-origin accounts API over trusted HTTPS.

Parameters:
  AccountsApiHostname:
    Type: String
    AllowedPattern: '[a-z0-9]+\.execute-api\.us-east-2\.amazonaws\.com'
  EdgeSecretArn:
    Type: String
    AllowedPattern: 'arn:[a-z0-9-]+:secretsmanager:us-east-2:[0-9]{12}:secret:[a-zA-Z0-9/_+=.@-]+'
  EvaluatorIp:
    Type: String
    AllowedPattern: '[0-9a-fA-F:.]{3,45}'

Resources:
  Website:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  WebsiteAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Ref AWS::StackName
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  EvaluatorAccess:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-access'
      AutoPublish: true
      FunctionConfig:
        Comment: Restrict prelaunch site and account routes to the evaluator connection
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          if (event.viewer.ip !== '${EvaluatorIp}') {
            return { statusCode: 403, statusDescription: 'Forbidden' };
          }
          var request = event.request;
          var pages = ['/sign-in', '/signup', '/verify-email', '/recover', '/reset-password', '/account'];
          if (pages.indexOf(request.uri) !== -1) request.uri = '/account-entry.html';
          return request;
        }

  NoCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-no-cache'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  AccountsRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-accounts'
        CookiesConfig:
          CookieBehavior: whitelist
          Cookies: [__Host-paige_cloud_session]
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Origin, Content-Type]
        QueryStringsConfig:
          QueryStringBehavior: none

  BrowserSecurity:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security'
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; img-src 'self' data:; style-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'"
            Override: true

  WebsitePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Website
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${Website.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Edge}'

  Edge:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Origins:
          - Id: website
            DomainName: !GetAtt Website.RegionalDomainName
            OriginAccessControlId: !Ref WebsiteAccess
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: accounts
            DomainName: !Ref AccountsApiHostname
            OriginCustomHeaders:
              - HeaderName: x-paige-cloud-edge
                HeaderValue: !Sub '{{resolve:secretsmanager:${EdgeSecretArn}:SecretString}}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: website
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: !Ref NoCache
          ResponseHeadersPolicyId: !Ref BrowserSecurity
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt EvaluatorAccess.FunctionARN
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/cloud/auth/*
            TargetOriginId: accounts
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref NoCache
            OriginRequestPolicyId: !Ref AccountsRequestPolicy
            ResponseHeadersPolicyId: !Ref BrowserSecurity
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt EvaluatorAccess.FunctionARN
          - PathPattern: /mission-control
            TargetOriginId: accounts
            ViewerProtocolPolicy: https-only
            CachePolicyId: !Ref NoCache
            OriginRequestPolicyId: !Ref AccountsRequestPolicy
            ResponseHeadersPolicyId: !Ref BrowserSecurity
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt EvaluatorAccess.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  SiteOrigin:
    Value: !Sub 'https://${Edge.DomainName}'
  WebsiteBucket:
    Value: !Ref Website
