name: Publish PAIGE Cloud owner view

on:
  pull_request:
    branches: [main]
  push:
    tags: [ant-177-owner-view-*]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('cloud-owner-view-pr-{0}', github.event.pull_request.number) || 'cloud-owner-view-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-owner-view:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test and build the exact owner-view PR head
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEW_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD"
          docker build --target verify ./owner-view
          docker build --tag "paige-cloud-owner-view-check:$REVIEW_HEAD" ./owner-view
          bash owner-view/sql/cloud-accounts/verify-postgres.sh
          printf 'Verified owner-view PR head `%s` (tests and image build; not published).\n' "$REVIEW_HEAD" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ant-177-owner-view-') && github.repository_id == '1465755482'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE_REPO: ghcr.io/paige-agent-ai/${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: paige-cloud-owner-view
            context: owner-view
            enabled: true
          - image: paige-cloud-media-pilot
            context: media-pilot
            enabled: ${{ startsWith(github.ref, 'refs/tags/ant-177-owner-view-media-pilot-') }}
    steps:
      - if: matrix.enabled
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Test and build the tagged source
        if: matrix.enabled
        env:
          BUILD_CONTEXT: ${{ matrix.context }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$BUILD_CONTEXT" == owner-view ]]; then docker build --target verify ./owner-view; fi
          image="$IMAGE_REPO:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image" "./$BUILD_CONTEXT"
          if [[ "$BUILD_CONTEXT" == media-pilot ]]; then bash media-pilot/smoke.sh "$image"; fi
          echo "CANDIDATE=$image" >> "$GITHUB_ENV"
      - name: Publish image and record immutable identity
        if: matrix.enabled
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker push "$CANDIDATE"
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$CANDIDATE" | tr -d '"')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "$IMAGE_REPO@$digest"
          [[ "$(docker image inspect --format '{{.Id}}' "$CANDIDATE")" == "$(docker image inspect --format '{{.Id}}' "$IMAGE_REPO@$digest")" ]]
          alias="$IMAGE_REPO:${digest/:/-}"
          docker tag "$CANDIDATE" "$alias"
          docker push "$alias"
          [[ "$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$alias" | tr -d '"')" == "$digest" ]]
          jq -n --arg commit "$GITHUB_SHA" --arg tag "$CANDIDATE" --arg image "$IMAGE_REPO@$digest" --arg coolifyTag "$alias" \
            '{commit:$commit,tag:$tag,image:$image,coolifyTag:$coolifyTag}' | tee -a "$GITHUB_STEP_SUMMARY"
