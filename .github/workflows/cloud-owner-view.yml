name: Publish PAIGE Cloud owner view

on:
  pull_request:
    branches: [main]
  push:
    tags: [ant-177-owner-view-*]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('cloud-owner-view-pr-{0}', github.event.pull_request.number) || 'cloud-owner-view-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-owner-view:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test and build the exact owner-view PR head
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$REVIEW_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEW_HEAD"
          docker build --target verify ./owner-view
          docker build --tag "paige-cloud-owner-view-check:$REVIEW_HEAD" ./owner-view
          bash owner-view/sql/cloud-accounts/verify-postgres.sh
          printf 'Verified owner-view PR head `%s` (tests and image build; not published).\n' "$REVIEW_HEAD" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the AWS accounts runtime package
        run: |
          set -euo pipefail
          docker run --rm --mount "type=bind,src=$PWD/owner-view/aws-accounts,dst=/candidate,readonly" \
            node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5 \
            sh -eu -c '
              mkdir /tmp/accounts && cd /tmp/accounts
              cp /candidate/*.mjs /candidate/package*.json /candidate/mission-control.html .
              npm ci --omit=dev --ignore-scripts --no-audit --no-fund
              node --test *.test.mjs
              node --check bootstrap.mjs
              export CLOUD_SITE_ORIGIN=https://cloud.example.test CLOUD_EVALUATORS=developer@example.test
              export CLOUD_EDGE_KEY=synthetic-edge-key-for-package-check-only
              export COGNITO_USER_POOL_ID=us-east-2_Example COGNITO_CLIENT_ID=exampleclient
              export CLOUD_DB_CLUSTER_ARN=synthetic-cluster CLOUD_DB_RUNTIME_SECRET_ARN=synthetic-secret CLOUD_DB_NAME=paige_cloud
              node --input-type=module -e "import { handler } from \"./runtime.mjs\"; if (typeof handler !== \"function\") process.exit(1);"
            '
      - name: Verify and record the exact independent workload build
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node --test infra/aws/customer-zero/workload/service.test.mjs
          python3 infra/aws/customer-zero/workload/build.py "$REVIEW_HEAD" "$RUNNER_TEMP/workload" --private-drill | tee -a "$GITHUB_STEP_SUMMARY"
          python3 infra/aws/customer-zero/workload/build.py "$REVIEW_HEAD" "$RUNNER_TEMP/workload-repeat" --private-drill
          cmp "$RUNNER_TEMP/workload/a.zip" "$RUNNER_TEMP/workload-repeat/a.zip"
          cmp "$RUNNER_TEMP/workload/b.zip" "$RUNNER_TEMP/workload-repeat/b.zip"
          cmp "$RUNNER_TEMP/workload/drill.zip" "$RUNNER_TEMP/workload-repeat/drill.zip"
          if cmp -s "$RUNNER_TEMP/workload/a.zip" "$RUNNER_TEMP/workload/b.zip"; then exit 1; fi

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ant-177-owner-view-') && github.repository_id == '1465755482'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE_REPO: ghcr.io/paige-agent-ai/${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: paige-cloud-owner-view
            context: owner-view
            enabled: true
          - image: paige-cloud-media-pilot
            context: media-pilot
            enabled: ${{ startsWith(github.ref, 'refs/tags/ant-177-owner-view-media-pilot-') }}
    steps:
      - if: matrix.enabled
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Test and build the tagged source
        if: matrix.enabled
        env:
          BUILD_CONTEXT: ${{ matrix.context }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$BUILD_CONTEXT" == owner-view ]]; then docker build --target verify ./owner-view; fi
          image="$IMAGE_REPO:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image" "./$BUILD_CONTEXT"
          if [[ "$BUILD_CONTEXT" == media-pilot ]]; then bash media-pilot/smoke.sh "$image"; fi
          echo "CANDIDATE=$image" >> "$GITHUB_ENV"
      - name: Publish image and record immutable identity
        if: matrix.enabled
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker push "$CANDIDATE"
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$CANDIDATE" | tr -d '"')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "$IMAGE_REPO@$digest"
          [[ "$(docker image inspect --format '{{.Id}}' "$CANDIDATE")" == "$(docker image inspect --format '{{.Id}}' "$IMAGE_REPO@$digest")" ]]
          alias="$IMAGE_REPO:${digest/:/-}"
          docker tag "$CANDIDATE" "$alias"
          docker push "$alias"
          [[ "$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$alias" | tr -d '"')" == "$digest" ]]
          jq -n --arg commit "$GITHUB_SHA" --arg tag "$CANDIDATE" --arg image "$IMAGE_REPO@$digest" --arg coolifyTag "$alias" \
            '{commit:$commit,tag:$tag,image:$image,coolifyTag:$coolifyTag}' | tee -a "$GITHUB_STEP_SUMMARY"
