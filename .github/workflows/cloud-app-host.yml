name: Publish PAIGE app for Coolify

on:
  push:
    tags: [cloud-app-host-*]

permissions:
  contents: read
  packages: write

concurrency:
  group: cloud-app-host-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Paige-Agent-AI/paige-cloud-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMAGE_REPO: ghcr.io/paige-agent-ai/paige-cloud-preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build the full frontend and verify routes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          frontend="$(cat app-host/frontend.commit)"
          [[ "$frontend" =~ ^[a-f0-9]{40}$ ]]
          image="$IMAGE_REPO:app-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --platform linux/amd64 -f app-host/Dockerfile \
            --build-arg "FRONTEND_COMMIT=$frontend" --build-arg "CLOUD_COMMIT=$GITHUB_SHA" --tag "$image" .
          container=$(docker run -d -p 127.0.0.1::8080 "$image")
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          base="http://$(docker port "$container" 8080/tcp)"
          curl -fsS --max-time 3 --retry 10 --retry-delay 1 --retry-all-errors "$base/healthz"
          curl -fsS "$base/release.json" | jq -e --arg cloud "$GITHUB_SHA" --arg frontend "$frontend" \
            '.cloudCommit == $cloud and .frontendCommit == $frontend'
          for pair in auth:auth.html privacy:privacy.html sms-terms:sms-terms.html operator/workspaces:index.html; do
            curl -fsS "$base/${pair%:*}" -o "$RUNNER_TEMP/paige-route.html"
            curl -fsS "$base/${pair#*:}" -o "$RUNNER_TEMP/paige-entry.html"
            test -s "$RUNNER_TEMP/paige-entry.html"
            cmp "$RUNNER_TEMP/paige-route.html" "$RUNNER_TEMP/paige-entry.html"
          done
          curl -fsSI "$base/sw.js" | grep -qi '^Cache-Control: no-cache, no-store'
          curl -fsSI "$base/embed.js" | grep -qi '^Cache-Control: public, max-age=300'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/assets/missing.js")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/auth")" = 405
          echo "CANDIDATE=$image" >> "$GITHUB_ENV"
      - name: Publish the verified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker push "$CANDIDATE"
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$CANDIDATE" | tr -d '"')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "$IMAGE_REPO@$digest"
          test "$(docker image inspect --format '{{.Id}}' "$CANDIDATE")" = "$(docker image inspect --format '{{.Id}}' "$IMAGE_REPO@$digest")"
          tag="${digest/:/-}"
          docker tag "$CANDIDATE" "$IMAGE_REPO:$tag"
          docker push "$IMAGE_REPO:$tag"
          test "$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$IMAGE_REPO:$tag" | tr -d '"')" = "$digest"
          jq -n --arg cloud "$GITHUB_SHA" --arg frontend "$(cat app-host/frontend.commit)" \
            --arg image "$IMAGE_REPO@$digest" --arg tag "$tag" \
            '{cloudCommit:$cloud,frontendCommit:$frontend,image:$image,coolifyTag:$tag}' | tee -a "$GITHUB_STEP_SUMMARY"
