worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map "$status:$uri" $preview_cache_control {
        ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
        default "no-store";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $preview_cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.fontshare.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; form-action 'none'; object-src 'none'; base-uri 'self'; frame-src 'none'; frame-ancestors 'none'; worker-src 'none'" always;

        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        location = /healthz {
            access_log off;
            default_type text/plain;
            if (!-f $document_root/index.html) { return 503; }
            return 200 "ok\n";
        }

        location = /version.json { try_files $uri =404; }
        location = /release.json { try_files $uri =404; }
        location = /privacy { try_files /privacy.html =404; }
        location = /sms-terms { try_files /sms-terms.html =404; }

        location ~* ^/(auth(\.html)?|login|signup|sign-in|sign-up|logout|reset-password)(/|$) {
            default_type text/plain;
            return 403 "Authentication is disabled in PAIGE Cloud preview.\n";
        }

        location = /sw.js { return 404; }
        location ^~ /api/ { return 404; }
        location ^~ /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
